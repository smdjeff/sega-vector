        <g id="planet">
            <circle id="body" stroke="#4A90E2" cx="100" cy="100" r="73"></circle>
            <circle id="crater1" stroke="#4A90E2" cx="67" cy="73" r="12"></circle>
            <circle id="crater2" stroke="#4A90E2" cx="123" cy="123" r="8"></circle>
        </g>
    </g>
</svg>
